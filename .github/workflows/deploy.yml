name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Create or Inject GTM_ID into config.js
        env:
          GTM_ID: ${{ vars.GTM_ID || secrets.GTM_ID }}
        run: |
          mkdir -p public
          if [ -n "$GTM_ID" ]; then
            echo "Injecting GTM_ID from repository variable/secret into config.js"
            cat <<CONFIG_EOF > public/config.js
const GTM_ID = '$GTM_ID';
if (typeof window !== 'undefined') {
  window.GTM_ID = GTM_ID;
}
CONFIG_EOF
          else
            echo "No GTM_ID variable found in GitHub Actions, creating default config.js"
            cat <<CONFIG_EOF > public/config.js
const GTM_ID = '';
if (typeof window !== 'undefined') {
  window.GTM_ID = GTM_ID;
}
CONFIG_EOF
          fi
          cp public/config.js config.js 2>/dev/null || true

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
